<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>栏规 · 探栏</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js">
    async function 刷栏规页() {
      const 规 = await 探栏.getJSON("/api/栏规");
      const box = document.getElementById("栏规表") || document.getElementById("表");
      if (box && box.tagName === "TBODY") {
        box.innerHTML = "";
        for (const [k,v] of Object.entries(规)) {
          box.appendChild(探栏.行(`<td>${探栏.安全文本(k)}</td><td>${探栏.安全文本(v)}</td>`));
        }
      }
      const checks = await 探栏.getJSON("/api/夹具/预检");
      const tb = document.getElementById("夹具预检表");
      if (tb) {
        tb.innerHTML = "";
        for (const c of checks) {
          tb.appendChild(探栏.行(`<td>${探栏.安全文本(c.夹具)}</td><td>${c.报文数}</td><td>${c.是否可装?"是":"否"}</td><td>${探栏.安全文本(c.摘要||"—")}</td>`));
        }
      }
    }
    const saveBtn = document.getElementById("保存栏规");
    if (saveBtn) {
      saveBtn.onclick = async () => {
        const el = document.getElementById("栏规回执");
        try {
          const body = {
            "PM25上限": document.getElementById("PM25上限")?.value,
            "PM25下限": document.getElementById("PM25下限")?.value,
            "站钟漂移阈秒": document.getElementById("站钟漂移阈秒")?.value,
          };
          Object.keys(body).forEach((k) => body[k] === undefined && delete body[k]);
          el.textContent = JSON.stringify(await 探栏.postJSON("/api/栏规", body), null, 2);
          await 刷栏规页();
        } catch (e) { el.textContent = String(e); }
      };
    }
    const refreshBtn = document.getElementById("刷新栏规");
    if (refreshBtn) refreshBtn.onclick = () => 刷栏规页();
    刷栏规页();
  </script>
</head>
<body>
  <div class="壳">
    <header class="顶牌">
      <h1>探栏</h1>
      <div class="骨">传感报文装载 → 标定/质控门槛入栏 → 站点汇总物化 → 坏点旁路 → 栏账互证<br/>皮：环境监测传感站 · 不是潮切关窗，也不是对拍双轨</div>
    </header>
    <div class="门槛条" id="门槛条"></div>
    <header class="顶牌" style="margin-bottom:10px">
      <h1 style="font-size:22px">栏规</h1>
      <div class="骨">当前栏号与质控阈值。</div>
    </header>

    <section class="卷"><h2>栏规原文</h2><pre class="回执" id="规">加载中…</pre><div class="工具 上距12">
        <button class="按钮" id="保存栏规">保存栏规补丁</button>
        <button class="按钮 次" id="刷新栏规">刷新</button>
      </div>
      <div class="双栏 上距12">
        <label class="只读框">PM25 上限 <input id="PM25上限" type="number" value="75"/></label>
        <label class="只读框">PM25 下限 <input id="PM25下限" type="number" value="0"/></label>
        <label class="只读框">站钟漂移阈（秒） <input id="站钟漂移阈秒" type="number" value="604800"/></label>
      </div>
      <pre class="回执 上距12" id="栏规回执">改门槛只影响后续装载；阈损坏会让整批装载失败闭，不写一行业务数据</pre>
    </section>
    <section class="卷">
      <h2>站钟漂移裁决</h2>
      <p class="说明" id="漂移策略">加载中…</p>
      <div class="表绕"><table><thead><tr><th>报文编号</th><th>站点</th><th>漂移秒</th><th>阈值秒</th><th>裁决</th></tr></thead><tbody id="漂移裁决表"></tbody></table></div>
    </section>
    <section class="卷">
      <h2>夹具预检</h2>
      <div class="表绕"><table><thead><tr><th>夹具</th><th>报文数</th><th>可装</th><th>摘要</th></tr></thead><tbody id="夹具预检表"></tbody></table></div>
    </section>
    <section class="卷"><h2>空桩目录</h2><p class="说明" id="空桩"></p>
      <div class="双栏"><p class="说明">栏规钉死当前栏与 PM25 上下限。分指标门槛属于空桩。</p>
      <div class="侧注">版式：底栏铜青。潮切是左侧窗时间轴浅纸底。</div></div>
    </section>
    <script>
    (async () => {
      const 规 = await 探栏.getJSON("/api/栏规");
      document.getElementById("规").textContent = JSON.stringify(规, null, 2);
      if (规["站钟漂移阈秒"] !== undefined) {
        document.getElementById("站钟漂移阈秒").value = 规["站钟漂移阈秒"];
      }
      const s = await 探栏.getJSON("/api/空桩");
      document.getElementById("空桩").textContent = "空桩 " + s.条数 + "：" + (s.空桩 || []).join(" · ");
      document.getElementById("漂移策略").textContent =
        "形态：甲-切流账册。可信点（漂移≤阈）正式入栏；偏钟超阈点带偏钟指纹切流进坏点匣，并写站钟偏移裁决账册，不做双写双轨。当前阈 " +
        探栏.安全文本(规["站钟漂移阈秒"] ?? "—") + " 秒。";
      const 裁决 = await 探栏.getJSON("/api/站钟偏移裁决");
      const tb = document.getElementById("漂移裁决表");
      if (!裁决.length) { tb.innerHTML = `<tr><td colspan="5">${探栏.空态("尚无裁决记录。")}</td></tr>`; }
      for (const v of 裁决.slice(0, 50)) {
        const 可信 = v.是否可信 === 1 || v.是否可信 === true;
        tb.appendChild(探栏.行(
          `<td>${探栏.安全文本(v.报文编号)}</td><td>${探栏.安全文本(v.站点键)}</td>` +
          `<td>${Number(v.漂移秒).toFixed(1)}</td><td>${Number(v.阈值秒).toFixed(1)}</td>` +
          `<td>${可信 ? 探栏.徽章("可信","好") : 探栏.徽章("偏钟","警")}</td>`
        ));
      }
    })();
    </script>

  </div>

  <nav class="底栏"><div class="底栏内">
    <a href="/" >探栏台</a>
    <a href="/报文流.html" >报文流</a>
    <a href="/入栏缓冲.html" >入栏缓冲</a>
    <a href="/站点汇总账.html" >站点汇总账</a>
    <a href="/坏点匣.html" >坏点匣</a>
    <a href="/栏贯验.html" >栏贯验</a>
    <a href="/站点源.html" >站点源</a>
    <a href="/栏规.html" class="亮">栏规</a>
  </div></nav>

  <script>
  (async () => {
    try {
      const o = await 探栏.getJSON("/api/概览");
      探栏.渲染门槛(document.getElementById("门槛条"), o.栏规 || {});
    } catch (e) {}
  })();
  </script>
</body>
</html>
